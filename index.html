<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carta | Postres y pastas</title>
  <meta name="description" content="Carta digital de Postres y pastas: café, bebidas, pastelería, galletas, crepes y salados.">
  <meta name="theme-color" content="#FFF9F6">
  <link rel="icon" href="img/marca/osito-cara.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/marca/icono-180.png">
  <link rel="stylesheet" href="css/fuentes.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#carta">Ir a la carta</a>

  <!-- PORTADA -->
  <header class="portada" id="inicio">
    <div class="portada__texto">
      <h1 class="portada__logo">
        <img src="img/marca/logo.svg" alt="Postres y pastas" width="522" height="258">
      </h1>
      <p class="portada__bienvenida" data-texto="bienvenida">Un abrazo de oso en cada taza</p>
      <p class="portada__sub" data-texto="subtitulo">Café, postres y pastas para quedarse un ratito más.</p>
      <div class="portada__acciones">
        <a class="boton boton--principal" href="#carta" data-ir-carta>Explorar nuestra carta</a>
        <a class="boton boton--whatsapp" data-whatsapp hidden target="_blank" rel="noopener">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3Z"/></svg>
          Escríbenos por WhatsApp
        </a>
      </div>
    </div>

    <!-- Composición: fotos de la carta + mascota -->
    <div class="escena" aria-hidden="true">
      <div class="escena__arco">
        <img src="img/carta/galletas-pila.webp" alt="" width="401" height="349">
      </div>
      <img class="escena__flor" src="img/marca/flor.svg" alt="">
      <img class="escena__galleta" src="img/carta/galleta-fudge.webp" alt="" width="204" height="187">

      <div class="escena__osito-caja">
      <svg class="escena__osito" viewBox="0 0 360 340">
        <g fill="none" stroke="#F057A2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <g class="osito__brazo">
            <path d="M118 214 C 90 208 68 190 56 166" stroke-width="40"/>
            <path d="M118 214 C 90 208 68 190 56 166" stroke="#FFF9F6" stroke-width="30"/>
            <circle cx="54" cy="160" r="22" fill="#FFF9F6"/>
            <ellipse cx="54" cy="165" rx="9" ry="7" fill="#FBDDEB" stroke="none"/>
            <circle cx="44" cy="151" r="3.6" fill="#FBDDEB" stroke="none"/>
            <circle cx="54" cy="147" r="3.6" fill="#FBDDEB" stroke="none"/>
            <circle cx="64" cy="151" r="3.6" fill="#FBDDEB" stroke="none"/>
            <path d="M22 142 q -6 14 0 28 M 30 124 q -12 8 -14 22" stroke-width="4"/>
          </g>
          <path d="M214 214 C 232 228 244 244 256 256" stroke-width="40"/>
          <path d="M214 214 C 232 228 244 244 256 256" stroke="#FFF9F6" stroke-width="30"/>
          <path d="M108 176 C 86 222 82 290 88 342 H 244 C 250 290 246 222 224 176" fill="#FFF9F6"/>
          <ellipse cx="166" cy="294" rx="48" ry="40" fill="#FBDDEB" stroke="none"/>
          <circle cx="102" cy="64" r="28" fill="#FFF9F6"/>
          <circle cx="102" cy="64" r="14" fill="#FBDDEB" stroke="none"/>
          <circle cx="230" cy="64" r="28" fill="#FFF9F6"/>
          <circle cx="230" cy="64" r="14" fill="#FBDDEB" stroke="none"/>
          <ellipse cx="166" cy="122" rx="84" ry="72" fill="#FFF9F6"/>
          <path d="M226 52 L 206 38 C 202 50 202 62 206 72 Z M226 52 L 248 44 C 250 56 248 66 242 74 Z" fill="#F057A2" stroke-width="3"/>
          <circle cx="226" cy="56" r="7" fill="#F057A2" stroke="none"/>
          <ellipse cx="166" cy="148" rx="31" ry="23" fill="#FBDDEB" stroke="none"/>
          <path d="M155 137 q 11 -6 22 0 q -2 10 -11 11 q -9 -1 -11 -11z" fill="#F057A2" stroke="none"/>
          <path d="M166 148 v6 M166 154 q -7 8 -14 2 M166 154 q 7 8 14 2" stroke-width="4"/>
          <g class="osito__ojos">
            <ellipse cx="132" cy="116" rx="6.5" ry="8" fill="#F057A2" stroke="none"/>
            <ellipse cx="200" cy="116" rx="6.5" ry="8" fill="#F057A2" stroke="none"/>
            <circle cx="134" cy="113" r="2" fill="#FFF9F6" stroke="none"/>
            <circle cx="202" cy="113" r="2" fill="#FFF9F6" stroke="none"/>
          </g>
          <ellipse cx="114" cy="146" rx="12" ry="7.5" fill="#F9B8D5" stroke="none"/>
          <ellipse cx="218" cy="146" rx="12" ry="7.5" fill="#F9B8D5" stroke="none"/>
          <g class="osito__salpicadura">
            <path d="M258 228 C 262 214 272 206 276 194 C 279 184 276 176 280 170 C 285 163 295 165 294 175 C 293 184 296 190 304 190 C 312 190 316 198 314 206 C 312 214 316 220 318 228 Z" fill="#F057A2" stroke="none"/>
            <circle cx="302" cy="154" r="5.5" fill="#F057A2" stroke="none"/>
            <circle cx="320" cy="176" r="3.5" fill="#F057A2" stroke="none"/>
            <circle cx="268" cy="182" r="3" fill="#F057A2" stroke="none"/>
          </g>
          <path d="M246 224 H 330 C 329 262 318 292 288 296 C 258 292 247 262 246 224 Z" fill="#FFF9F6"/>
          <path d="M328 238 c 22 -4 26 30 -4 30"/>
          <path d="M300 250 c -2 16 -8 28 -20 34" stroke-width="4" stroke="#FBDDEB"/>
          <circle cx="258" cy="258" r="21" fill="#FFF9F6"/>
          <path d="M248 250 q 6 4 4 12 M258 246 q 6 4 4 12" stroke-width="3.5"/>
        </g>
      </svg>
      </div>

      <div class="escena__mostrador"></div>
      <img class="escena__crepe" src="img/carta/crepe.webp" alt="" width="279" height="200">
    </div>
  </header>

  <!-- CARTA -->
  <main class="carta" id="carta" tabindex="-1">
    <nav class="categorias" aria-label="Categorías de la carta">
      <img class="categorias__logo" src="img/marca/logo.svg" alt="" width="522" height="258">
      <div class="categorias__lista" role="tablist" aria-label="Categorías" data-lista-categorias></div>
      <button class="arriba" type="button" data-arriba aria-label="Volver al inicio">
        <img src="img/marca/osito-cara.svg" alt="" width="196" height="172">
        <span class="arriba__texto">Volver al inicio</span>
      </button>
    </nav>

    <div class="carta__contenido">
      <section class="destacados" data-destacados hidden aria-labelledby="titulo-destacados">
        <h2 class="destacados__titulo" id="titulo-destacados">Destacados</h2>
        <ul class="destacados__fila" data-fila-destacados></ul>
      </section>

      <section class="panel" role="tabpanel" data-panel tabindex="-1">
        <noscript><p class="aviso">Activa JavaScript para ver la carta.</p></noscript>
      </section>
    </div>
  </main>

  <footer class="pie">
    <img class="pie__flor" src="img/marca/flor.svg" alt="" width="217" height="229">
    <img class="pie__logo" src="img/marca/logo.svg" alt="Postres y pastas" width="522" height="258">
    <p class="pie__nota">Precios en soles (S/).</p>
    <a class="boton boton--whatsapp" data-whatsapp hidden target="_blank" rel="noopener">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3Z"/></svg>
      Escríbenos por WhatsApp
    </a>
  </footer>

  <!-- VENTANA DE DETALLE -->
  <dialog class="detalle" data-detalle aria-labelledby="detalle-nombre">
    <div class="detalle__marco" data-cerrar-fuera>
      <div class="detalle__hoja" data-hoja>
        <img class="detalle__osito" src="img/marca/osito-asoma.svg" alt="" width="196" height="196">
        <button class="detalle__cerrar" type="button" data-cerrar aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <div class="detalle__contenido" data-contenido>
          <div class="detalle__asa" aria-hidden="true"></div>
          <div class="detalle__foto" data-detalle-foto></div>
          <div class="detalle__info">
            <p class="detalle__categoria" data-detalle-categoria></p>
            <h3 class="detalle__nombre" id="detalle-nombre" data-detalle-nombre></h3>
            <p class="detalle__precio" data-detalle-precio></p>
            <p class="detalle__desc" data-detalle-desc></p>
            <p class="detalle__nota" data-detalle-nota></p>
            <button class="boton boton--suave detalle__volver" type="button" data-cerrar>Volver a la carta</button>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="data/carta.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
